# ============================================================
# Main configuration file for a single experiment.
#
# The experiment is defined by:
#   1. dynamical system
#   2. selected parameter examples
#   3. computational grid
#   4. experiment modes
#   5. filtrations
#   6. normalization
#   7. noise level
#   8. ECP/topological parameters
#   9. output and visualization options
#
# The configuration is read by src/config.py.
# ============================================================

# ------------------------------------------------------------
# SYSTEM
# 
# Available systems to analyse:
#   LINEAR - 2D linear autonomous systems
#   HB -  Hopf bifurcation system
#   FHN - FitzHugh-Nagumo system
#   LORENZ - 3D Lorenz system
# ------------------------------------------------------------

[system]
name = "LINEAR"

# ------------------------------------------------------------
# EXAMPLES
# 
# "*" selects ALL predefined examples for the selected system.
#
# Alternatively, provide exact example names defined in the corresponding examples_*.py file.
#
# LINEAR examples:
#   "stable node 1"
#   "stable node 2"
#   "unstable node 1"
#   "unstable node 2"
#   "saddle 1"
#   "saddle 2"
#   "saddle 3"
#   "saddle 4"
#   "stable focus 1"
#   "stable focus 2"
#   "unstable focus 1"
#   "unstable focus 2"
#   "center 1"
#   "center 2"
#
# HB examples:
#   "beta=-1.0"
#   "beta=-0.9"
#   ...
#   ...
#   "beta=1.0"
#
# FHN examples:
#   "B=0.8, I=-16.0"
#   "B=0.8, I=5.0"
#   "B=2.0, I=3.5"
#   "B=2.0, I=5.45"
#   "B=0.8, I=0.0"
#   "B=0.5, I=3.0"
#   "B=1.5, I=4.0"
#   "B=2.0, I=4.2"
#   "B=0.8, I=10.0"
#
# LORENZ examples:
#   "rho=24.0"
#   "rho=24.1"
#   ...
#   ...
#   "rho=28.0"
#
# Examples must match the names generated by the corresponding examples_*.py module exactly.
# ------------------------------------------------------------

examples = ["*"]

# ------------------------------------------------------------
# GRID
#
# 2D Example:
# minimum = [-2.0, -2.0]
# maximum = [ 2.0,  2.0]
# points  = [101, 101]
#
# 3D Example:
# minimum = [-20.0, -20.0, 0.0]
# maximum = [ 20.0,  20.0, 40.0]
# points  = [51, 51, 51]
#
# The number of grid dimensions must match the dimension of the selected dynamical system.
# ------------------------------------------------------------

[grid]
minimum = [-2.0, -2.0]
maximum = [ 2.0,  2.0]
points  = [51, 51]

# ------------------------------------------------------------
# EXPERIMENT
# Available:
#   clean - Analyse the original vector fields.
#   noisy - Add Gaussian noise to the vector fields and analyse the noisy dataset.
#   full - Run clean, noisy and clean + noisy
#
# Examples:
# modes = "clean"
# modes = "noisy"
# modes = "full"
# ------------------------------------------------------------

[experiment]
modes = ["clean"]

# ------------------------------------------------------------
# FILTRATIONS
# Available:
#   vector - Original vector field.
#   vector_div - Vector field + divergence.
#   vector_curl - Vector field + curl.
#   vector_angle - Vector field + angle (defined only for 2D vector fields).
#   eigs - Jacobian eigenvalue representation.
#
# Available filtrations depend on the dimension.
#
# ------------------------------------------------------------

filtrations = ["vector", "vector_div", "vector_curl", "vector_angle", "eigs"]


# ------------------------------------------------------------
# NORMALIZATION
# Available:
#   none - No normalization.
#   minmax_global - Min-max normalization using all field components jointly.
#   minmax_channel - Min-max normalization independently for each vector component.
#   zscore_global - Global standard-score normalization.
#   zscore_channel - Standard-score normalization independently for each vector component.
#   unit_vector - Normalize vectors according to their magnitude.
#   max_norm_global - Normalize by the maximum vector magnitude occurring anywhere in the spatial domain.

normalization = "none"


# ------------------------------------------------------------
# NOISE
# Fraction of the component-wise standard deviation used as the standard deviation of the added Gaussian noise.
#
# Example:
#   fraction = 0.0 - no noise
#   fraction = 0.01 - 1% of the component standard deviation
#   fraction = 0.10 - 10% of the component standard deviation
# ------------------------------------------------------------

[noise]
fraction = 0.05


# ------------------------------------------------------------
# TOPOLOGY / ECP
# Default lower and upper bounds used for the ECP domain.
# The number of values in this interval is determined by default_resolution- number of discretization points per ECP dimension..
# ------------------------------------------------------------

[topology]
#default_range = [-1, 1]
default_resolution = 10201


# ------------------------------------------------------------
# ECP DISCRETIZATION
# true: use the configured/default discretization strategy.
# false: use the exact representation supported by the topology implementation.
# If the value is omitted, the program may choose the strategy automatically according to filtration dimensionality.
# ------------------------------------------------------------

discretization = true

# ------------------------------------------------------------
# OUTPUT
# Root directory for the experiment results.
# ------------------------------------------------------------

[output]

directory = "LINEAR_all"


# ------------------------------------------------------------
# PHASE PORTRAITS / ECP IMAGES
# true: save ECP visualizations.
# false: do not generate images.
# ------------------------------------------------------------

save_phase_portraits = true
save_ecp_images = true
